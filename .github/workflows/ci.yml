name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # setup-uv already creates and exports a .venv, so this installs into it.
      # Not `--system`: the uv-managed interpreter refuses to be installed into.
      - run: uv pip install -e ".[dev]"

      # No backend, no database, no API keys: the RAG service is replaced by an
      # httpx MockTransport and the store is in-memory SQLite.
      - run: uv run pytest -q
